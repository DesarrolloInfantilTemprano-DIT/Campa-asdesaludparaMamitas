<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación de Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
        }

        .input-premium {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #cbd5e1;
            transition: all 0.3s ease;
        }

        .input-premium:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 py-8">

    <div class="glass-card w-full max-w-2xl rounded-[2.5rem] overflow-hidden">
        
        <!-- Encabezado -->
        <div class="bg-gradient-to-r from-indigo-700 via-indigo-800 to-purple-900 p-8 text-white">
            <span class="bg-white/10 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-white/10">
                <i class="fas fa-hospital-user mr-1"></i> Módulo de Citas
            </span>
            <h1 class="text-3xl font-extrabold mt-3">Agendamiento de Citas</h1>
            <p class="text-indigo-200 text-xs mt-1">Consulte el DNI para habilitar la cita</p>
        </div>

        <form id="appointmentForm" class="p-6 md:p-8 space-y-6">
            
            <!-- Paso 1: Búsqueda -->
            <div class="space-y-3">
                <label class="text-xs font-extrabold text-indigo-700 uppercase tracking-wider block">1. Búsqueda de Paciente</label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="dniInput" maxlength="8" required
                            class="w-full pl-11 pr-4 py-3.5 rounded-2xl outline-none input-premium font-bold text-slate-800"
                            placeholder="Ingrese N° de DNI">
                    </div>
                    <button type="button" onclick="validarConsultaDNI()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 rounded-2xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-indigo-100">
                        <i class="fas fa-search"></i> Validar
                    </button>
                </div>
            </div>

            <!-- Paso 2 y 3: Datos y Selección -->
            <div id="resultPanel" class="hidden space-y-6 pt-4 border-t border-slate-200">
                
                <!-- Datos Filiatorios -->
                <div class="space-y-4">
                    <label class="text-xs font-extrabold text-indigo-700 uppercase tracking-wider block">2. Datos Filiatorios</label>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-full">
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Nombres y Apellidos del Paciente</label>
                            <input type="text" id="nombre_paciente" readonly class="w-full p-3 rounded-xl bg-slate-100 font-bold text-slate-800 outline-none border border-slate-200">
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Fecha Nacimiento</label>
                            <input type="text" id="fecha_nacimiento" readonly class="w-full p-3 rounded-xl bg-slate-100 font-semibold text-slate-800 outline-none border border-slate-200">
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">N° Celular</label>
                            <input type="text" id="celular" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                        </div>

                        <div class="col-span-full">
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Edad (Calculada a la Fecha de la Cita)</label>
                            <input type="text" id="edad" readonly class="w-full p-3 rounded-xl bg-indigo-50 font-bold text-indigo-900 border border-indigo-200 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Programación -->
                <div class="space-y-4 pt-4 border-t border-dashed border-slate-200">
                    <label class="text-xs font-extrabold text-indigo-700 uppercase tracking-wider block">3. Programación de la Cita</label>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Consultorio</label>
                            <select id="consultorio" onchange="actualizarFechasDisponibles()" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Cargando...</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Fecha Cita</label>
                            <select id="fecha_cita" onchange="actualizarHorasDisponibles()" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione Consultorio</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Hora Atención</label>
                            <select id="hora_atencion" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione Fecha</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Botón de Agendamiento -->
                <button type="button" id="btnAgendar" onclick="agendarCitaFinal()"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-100 transition-all">
                    <i class="fas fa-calendar-check mr-2"></i> AGENDAR CITA
                </button>
            </div>

            <!-- Ayuda Inicial -->
            <div id="initialHelp" class="text-center py-10 text-slate-400">
                <i class="fas fa-search-location text-4xl mb-3 text-indigo-400"></i>
                <p class="text-sm font-semibold text-slate-600">Ingrese el DNI para consultar el padrón</p>
            </div>

        </form>
    </div>

    <script>
        const URL_CONSULTA = "https://script.google.com/macros/s/AKfycbzFJPWYyiVo1d5lJnG6LtRRkCp6pOyvfvMbApsa1GWTr02m4b2NLLvV7XyKOIyPVVcCmg/exec";
        const URL_DESTINO  = "https://script.google.com/macros/s/AKfycbw2x59R9M1mFyS5dYPihmzYip1jYj2Dd833IY3rmPWYeQNoALuO7fXmj9uexz_OgMgYYg/exec";

        let programaData = [];
        let fechaNacimientoRaw = null;

        async function validarConsultaDNI() {
            const dni = document.getElementById('dniInput').value.trim();
            if (dni.length < 8) return Swal.fire('DNI Inválido', 'Ingrese los 8 dígitos correspondientes.', 'warning');

            Swal.fire({
                title: 'Validando Padrón',
                text: 'Buscando datos...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const response = await fetch(URL_CONSULTA);
                const data = await response.json();

                let paciente = null;

                // 1. Buscar DNI en Columna B (Madre)
                const busquedaMadre = data.find(item => {
                    const colB = String(item.dniMadre || item.colB || item[1] || "").trim();
                    return colB === dni;
                });

                if (busquedaMadre) {
                    paciente = {
                        nombre: busquedaMadre.nombreMadre || busquedaMadre.colC || busquedaMadre[2] || "MADRE REGISTRADA",
                        celular: busquedaMadre.celular || busquedaMadre.colE || busquedaMadre[4] || "",
                        fechaNac: "No aplica",
                        rawFNac: null,
                        edadTexto: "MADRE"
                    };
                } else {
                    // 2. Buscar DNI en Columna H (Niño)
                    const busquedaHijo = data.find(item => {
                        const colH = String(item.dniHijo || item.colH || item[7] || "").trim();
                        return colH === dni;
                    });

                    if (busquedaHijo) {
                        const rawFNac = busquedaHijo.fechaNacHijo || busquedaHijo.colJ || busquedaHijo[9] || null;
                        
                        paciente = {
                            nombre: busquedaHijo.nombreHijo || busquedaHijo.colI || busquedaHijo[8] || "PACIENTE NIÑO",
                            celular: busquedaHijo.celular || busquedaHijo.colE || busquedaHijo[4] || "",
                            fechaNac: rawFNac ? formatearFechaTexto(rawFNac) : "No registrada",
                            rawFNac: rawFNac,
                            edadTexto: rawFNac ? "Seleccione Fecha Cita para calcular" : "MADRE"
                        };
                    }
                }

                if (paciente) {
                    fechaNacimientoRaw = paciente.rawFNac;
                    document.getElementById('nombre_paciente').value = paciente.nombre;
                    document.getElementById('fecha_nacimiento').value = paciente.fechaNac;
                    document.getElementById('celular').value = paciente.celular;
                    document.getElementById('edad').value = paciente.edadTexto;

                    await cargarProgramaConfig();

                    document.getElementById('resultPanel').classList.remove('hidden');
                    document.getElementById('initialHelp').classList.add('hidden');
                    Swal.close();
                } else {
                    Swal.fire('DNI No Autorizado', 'El DNI no fue localizado en la Columna B ni en la Columna H.', 'error');
                }
            } catch (err) {
                Swal.fire('Error de Conexión', 'No se pudo consultar el padrón.', 'error');
            }
        }

        // Calcula la Edad exactas restando: FECHA CITA - FECHA NACIMIENTO
        function calcularEdadAlDiaDeCita(fechaNacStr, fechaCitaStr) {
            if (!fechaNacStr) return "MADRE";

            // Parsear Fecha Cita (Formato DD/MM/YYYY)
            const partesCita = fechaCitaStr.split('/');
            if (partesCita.length !== 3) return "MADRE";
            const fechaCita = new Date(partesCita[2], partesCita[1] - 1, partesCita[0]);

            // Parsear Fecha Nacimiento
            const fechaNac = new Date(fechaNacStr);
            if (isNaN(fechaNac.getTime()) || isNaN(fechaCita.getTime())) return "MADRE";

            let aos = fechaCita.getFullYear() - fechaNac.getFullYear();
            let meses = (fechaCita.getFullYear() - fechaNac.getFullYear()) * 12 + (fechaCita.getMonth() - fechaNac.getMonth());

            if (fechaCita.getDate() < fechaNac.getDate()) {
                meses--;
            }

            if (meses < 1) return "Recién Nacido";
            if (meses < 12) return `${meses} Mese(s)`;
            if (aos === 1) return "1 Año";
            return `${aos} Años`;
        }

        function formatearFechaTexto(fStr) {
            if (!fStr) return "No registrada";
            const f = new Date(fStr);
            if (isNaN(f.getTime())) return String(fStr);
            const d = ("0" + f.getDate()).slice(-2);
            const m = ("0" + (f.getMonth() + 1)).slice(-2);
            return `${d}/${m}/${f.getFullYear()}`;
        }

        async function cargarProgramaConfig() {
            try {
                const res = await fetch(URL_DESTINO + "?action=obtenerPrograma");
                const json = await res.json();
                if (json.status === "success") {
                    programaData = json.data;
                    poblarConsultorios();
                }
            } catch (err) {
                console.error("Error al obtener datos de PROGRAMA", err);
            }
        }

        function poblarConsultorios() {
            const select = document.getElementById('consultorio');
            select.innerHTML = '<option value="" disabled selected>Seleccione Consultorio</option>';
            const consultoriosUnicos = [...new Set(programaData.map(p => p.consultorio))];
            consultoriosUnicos.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function actualizarFechasDisponibles() {
            const cons = document.getElementById('consultorio').value;
            const selectFecha = document.getElementById('fecha_cita');
            selectFecha.innerHTML = '<option value="" disabled selected>Seleccione Fecha</option>';
            document.getElementById('hora_atencion').innerHTML = '<option value="" disabled selected>Seleccione Fecha Primero</option>';

            const fechasFiltradas = [...new Set(
                programaData.filter(p => p.consultorio === cons).map(p => p.fecha)
            )];

            fechasFiltradas.forEach(f => {
                selectFecha.innerHTML += `<option value="${f}">${f}</option>`;
            });
        }

        function actualizarHorasDisponibles() {
            const cons = document.getElementById('consultorio').value;
            const fechaSelected = document.getElementById('fecha_cita').value;
            const selectHora = document.getElementById('hora_atencion');
            selectHora.innerHTML = '<option value="" disabled selected>Seleccione Hora</option>';

            // Al seleccionar fecha de cita, recalcular automáticamente la edad
            if (fechaNacimientoRaw) {
                const edadCalculada = calcularEdadAlDiaDeCita(fechaNacimientoRaw, fechaSelected);
                document.getElementById('edad').value = edadCalculada;
            } else {
                document.getElementById('edad').value = "MADRE";
            }

            const horasFiltradas = [...new Set(
                programaData.filter(p => p.consultorio === cons && p.fecha === fechaSelected).map(p => p.hora)
            )];

            horasFiltradas.forEach(h => {
                selectHora.innerHTML += `<option value="${h}">${h}</option>`;
            });
        }

        async function agendarCitaFinal() {
            const dni = document.getElementById('dniInput').value.trim();
            const nombre = document.getElementById('nombre_paciente').value;
            const fnac = document.getElementById('fecha_nacimiento').value;
            const cel = document.getElementById('celular').value.trim();
            const edad = document.getElementById('edad').value;
            const consultorio = document.getElementById('consultorio').value;
            const fechaCita = document.getElementById('fecha_cita').value;
            const horaAtencion = document.getElementById('hora_atencion').value;

            if (!cel || !consultorio || !fechaCita || !horaAtencion) {
                return Swal.fire('Incompleto', 'Complete los campos obligatorios para continuar.', 'warning');
            }

            const payload = {
                dni_paciente: dni,
                nombre_paciente: nombre,
                fecha_nacimiento: fnac,
                celular: cel,
                edad: edad,
                consultorio: consultorio,
                fecha_cita: fechaCita,
                hora_atencion: horaAtencion
            };

            const btn = document.getElementById('btnAgendar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PROCESANDO...';

            try {
                const response = await fetch(URL_DESTINO, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "error_cupos") {
                    Swal.fire('Sin Cupos', 'No hay cupos disponibles para esta combinación de fecha y hora.', 'warning');
                } else if (result.status === "success") {
                    Swal.fire('Éxito', 'La cita fue agendada correctamente.', 'success');
                    document.getElementById('appointmentForm').reset();
                    document.getElementById('resultPanel').classList.add('hidden');
                    document.getElementById('initialHelp').classList.remove('hidden');
                } else {
                    Swal.fire('Error', result.message || 'No se pudo agendar.', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Error al comunicarse con el servidor.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-calendar-check mr-2"></i> AGENDAR CITA';
            }
        }
    </script>
</body>
</html>
