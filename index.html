<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Infantil de Citas 🎈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: #e0f2fe;
            background-image: 
                radial-gradient(#38bdf8 1.5px, transparent 1.5px), 
                radial-gradient(#38bdf8 1.5px, #e0f2fe 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            min-height: 100vh;
        }

        .font-kids {
            font-family: 'Fredoka', cursive;
        }

        .card-infantil {
            background: #ffffff;
            border: 4px solid #38bdf8;
            box-shadow: 0 12px 0 0 #0284c7;
            border-radius: 2rem;
        }

        .input-infantil {
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            border-radius: 1.2rem;
            transition: all 0.2s ease;
        }

        .input-infantil:focus {
            border-color: #06b6d4;
            background: #fff;
            transform: scale(1.01);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.2);
        }

        .btn-divertido {
            background: #06b6d4;
            box-shadow: 0 6px 0 0 #0891b2;
            border-radius: 1.2rem;
            transition: all 0.1s ease;
        }

        .btn-divertido:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 0 #0891b2;
        }

        .btn-divertido:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 #0891b2;
        }

        .btn-agendar {
            background: #10b981;
            box-shadow: 0 8px 0 0 #059669;
            border-radius: 1.5rem;
            transition: all 0.1s ease;
        }

        .btn-agendar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 0 #059669;
        }

        .btn-agendar:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 0 #059669;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .bounce-icon {
            animation: bounce-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 py-8">

    <div class="card-infantil w-full max-w-2xl overflow-hidden my-auto">
        
        <!-- Encabezado Infantil -->
        <div class="bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 p-6 md:p-8 text-white relative">
            <div class="flex items-center justify-between">
                <div>
                    <span class="bg-yellow-300 text-yellow-900 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider shadow-sm font-kids inline-block">
                        <i class="fas fa-star text-amber-600 mr-1"></i> Padrón Pediátrico
                    </span>
                    <h1 class="text-3xl md:text-4xl font-black mt-2 font-kids tracking-wide text-white drop-shadow-md">
                        ¡Agenda tu Cita! 🧸
                    </h1>
                    <p class="text-sky-100 text-sm font-bold mt-1">Consulte el DNI para verificar la atención</p>
                </div>
                <div class="hidden sm:flex text-5xl text-yellow-300 bounce-icon">
                    <i class="fas fa-heart-pulse"></i>
                </div>
            </div>
        </div>

        <form id="appointmentForm" class="p-6 md:p-8 space-y-6">
            
            <!-- Paso 1: Búsqueda -->
            <div class="bg-sky-50 p-5 rounded-2xl border-2 border-sky-200">
                <label class="text-xs font-black text-sky-800 uppercase tracking-wider block font-kids mb-2">
                    <i class="fas fa-search text-sky-500 mr-1"></i> 1. Buscar Paciente por DNI
                </label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-sky-400 text-lg"></i>
                        <input type="text" id="dniInput" maxlength="8" required
                            class="w-full pl-12 pr-4 py-3.5 input-infantil font-black text-slate-700 text-lg outline-none"
                            placeholder="DNI del niño o madre">
                    </div>
                    <button type="button" onclick="validarConsultaDNI()" 
                        class="btn-divertido text-white px-8 py-3.5 font-black font-kids text-lg flex items-center justify-center gap-2">
                        <i class="fas fa-smile text-xl"></i> Buscar
                    </button>
                </div>
            </div>

            <!-- Paso 2 y 3: Datos y Selección -->
            <div id="resultPanel" class="hidden space-y-6">
                
                <!-- Datos Filiatorios -->
                <div class="bg-amber-50 p-5 rounded-2xl border-2 border-amber-200 space-y-4">
                    <label class="text-xs font-black text-amber-800 uppercase tracking-wider block font-kids">
                        <i class="fas fa-child text-amber-500 mr-1"></i> 2. Datos del Paciente
                    </label>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-full">
                            <label class="text-xs font-bold text-slate-600 uppercase">Nombres y Apellidos</label>
                            <input type="text" id="nombre_paciente" readonly 
                                class="w-full p-3.5 rounded-xl bg-white border-2 border-slate-200 font-extrabold text-slate-800 outline-none">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 uppercase">Fecha de Nacimiento</label>
                            <input type="text" id="fecha_nacimiento" readonly 
                                class="w-full p-3.5 rounded-xl bg-white border-2 border-slate-200 font-extrabold text-slate-800 outline-none">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 uppercase">N° Celular</label>
                            <input type="text" id="celular" required 
                                class="w-full p-3.5 input-infantil font-extrabold text-slate-800 outline-none">
                        </div>

                        <div class="col-span-full">
                            <label class="text-xs font-bold text-slate-600 uppercase">Edad Exacta (al día de la cita)</label>
                            <input type="text" id="edad" readonly 
                                class="w-full p-3.5 rounded-xl bg-yellow-100 border-2 border-yellow-300 font-black text-amber-900 text-lg outline-none">
                        </div>
                    </div>
                </div>

                <!-- Programación -->
                <div class="bg-indigo-50 p-5 rounded-2xl border-2 border-indigo-200 space-y-4">
                    <label class="text-xs font-black text-indigo-800 uppercase tracking-wider block font-kids">
                        <i class="fas fa-calendar-alt text-indigo-500 mr-1"></i> 3. Elegir Turno de Cita
                    </label>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-600 uppercase">Consultorio</label>
                            <select id="consultorio" onchange="actualizarFechasDisponibles()" required 
                                class="w-full p-3.5 input-infantil font-bold text-slate-800 outline-none">
                                <option value="" disabled selected>Cargando...</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 uppercase">Fecha Cita</label>
                            <select id="fecha_cita" onchange="actualizarHorasDisponibles()" required 
                                class="w-full p-3.5 input-infantil font-bold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione Consultorio</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 uppercase">Hora Atención</label>
                            <select id="hora_atencion" required 
                                class="w-full p-3.5 input-infantil font-bold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione Fecha</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Botón de Agendamiento -->
                <button type="button" id="btnAgendar" onclick="agendarCitaFinal()"
                    class="btn-agendar w-full text-white py-4 font-black font-kids text-xl tracking-wide flex items-center justify-center gap-2">
                    <i class="fas fa-check-circle text-2xl"></i> ¡CONFIRMAR CITA!
                </button>
            </div>

            <!-- Estado Vacío Inicial -->
            <div id="initialHelp" class="text-center py-8 text-slate-400">
                <i class="fas fa-hospital-user text-5xl text-sky-300 mb-3 bounce-icon block"></i>
                <p class="text-base font-bold text-slate-600 font-kids">Escribe el DNI arriba para comenzar la búsqueda</p>
            </div>

        </form>
    </div>

    <script>
        const URL_CONSULTA = "https://script.google.com/macros/s/AKfycbzFJPWYyiVo1d5lJnG6LtRRkCp6pOyvfvMbApsa1GWTr02m4b2NLLvV7XyKOIyPVVcCmg/exec";
        const URL_DESTINO  = "https://script.google.com/macros/s/AKfycbwapFFHeqcq5lRDEJBPzX3iottwo3ITQkktSn7aTvJMmTTYK7nDVdK5tduWi1jP1gf4cw/exec";

        let programaData = [];
        let fechaNacimientoRaw = null;

        async function validarConsultaDNI() {
            const dni = document.getElementById('dniInput').value.trim();
            if (dni.length < 8) {
                return Swal.fire({
                    icon: 'warning',
                    title: 'DNI Incompleto',
                    text: 'El DNI debe contener 8 dígitos.',
                    confirmButtonColor: '#06b6d4'
                });
            }

            Swal.fire({
                title: 'Verificando el DNI...',
                text: 'Por favor espere un momento 🎈',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const response = await fetch(URL_CONSULTA);
                const data = await response.json();

                let paciente = null;

                // 1. Buscar DNI en Columna B (Madre)
                const busquedaMadre = data.find(item => {
                    const colB = String(item.dniMadre || item.colB || item[1] || "").trim();
                    return colB === dni;
                });

                if (busquedaMadre) {
                    paciente = {
                        nombre: busquedaMadre.nombreMadre || busquedaMadre.colC || busquedaMadre[2] || "MADRE REGISTRADA",
                        celular: busquedaMadre.celular || busquedaMadre.colE || busquedaMadre[4] || "",
                        fechaNac: "No aplica",
                        rawFNac: null,
                        edadTexto: "MADRE"
                    };
                } else {
                    // 2. Buscar DNI en Columna H (Niño) -> Fecha Nacimiento en Columna J (Índice 9)
                    const busquedaHijo = data.find(item => {
                        const colH = String(item.dniHijo || item.colH || item[7] || "").trim();
                        return colH === dni;
                    });

                    if (busquedaHijo) {
                        // Se extrae la Fecha de Nacimiento exactamente de la Columna J
                        const rawFNac = busquedaHijo.fechaNacHijo || busquedaHijo.colJ || busquedaHijo[9] || null;
                        
                        paciente = {
                            nombre: busquedaHijo.nombreHijo || busquedaHijo.colI || busquedaHijo[8] || "PACIENTE NIÑO",
                            celular: busquedaHijo.celular || busquedaHijo.colE || busquedaHijo[4] || "",
                            fechaNac: rawFNac ? formatearFechaTexto(rawFNac) : "No registrada",
                            rawFNac: rawFNac,
                            edadTexto: rawFNac ? "Seleccione Fecha Cita para calcular" : "MADRE"
                        };
                    }
                }

                if (paciente) {
                    fechaNacimientoRaw = paciente.rawFNac;
                    document.getElementById('nombre_paciente').value = paciente.nombre;
                    document.getElementById('fecha_nacimiento').value = paciente.fechaNac;
                    document.getElementById('celular').value = paciente.celular;
                    document.getElementById('edad').value = paciente.edadTexto;

                    await cargarProgramaConfig();

                    document.getElementById('resultPanel').classList.remove('hidden');
                    document.getElementById('initialHelp').classList.add('hidden');
                    Swal.close();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'DNI No Encontrado',
                        text: 'Es necesario que actualice sus datos desde el Módulo Mi Familia, recuerde primero activar su ubicación).',
                        confirmButtonColor: '#06b6d4'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Conexión',
                    text: 'No se pudo consultar la base de datos.',
                    confirmButtonColor: '#06b6d4'
                });
            }
        }

        // Calcula la Edad restando FECHA CITA - FECHA NACIMIENTO
        function calcularEdadAlDiaDeCita(fechaNacStr, fechaCitaStr) {
            if (!fechaNacStr) return "MADRE";

            const partesCita = fechaCitaStr.split('/');
            if (partesCita.length !== 3) return "MADRE";
            const fechaCita = new Date(partesCita[2], partesCita[1] - 1, partesCita[0]);

            const fechaNac = new Date(fechaNacStr);
            if (isNaN(fechaNac.getTime()) || isNaN(fechaCita.getTime())) return "MADRE";

            let aos = fechaCita.getFullYear() - fechaNac.getFullYear();
            let meses = (fechaCita.getFullYear() - fechaNac.getFullYear()) * 12 + (fechaCita.getMonth() - fechaNac.getMonth());

            if (fechaCita.getDate() < fechaNac.getDate()) {
                meses--;
            }

            if (meses < 1) return "Recién Nacido";
            if (meses < 12) return `${meses} Mese(s)`;
            if (aos === 1) return "1 Año";
            return `${aos} Años`;
        }

        function formatearFechaTexto(fStr) {
            if (!fStr) return "No registrada";
            const f = new Date(fStr);
            if (isNaN(f.getTime())) return String(fStr);
            const d = ("0" + f.getDate()).slice(-2);
            const m = ("0" + (f.getMonth() + 1)).slice(-2);
            return `${d}/${m}/${f.getFullYear()}`;
        }

        async function cargarProgramaConfig() {
            try {
                const res = await fetch(URL_DESTINO + "?action=obtenerPrograma");
                const json = await res.json();
                if (json.status === "success") {
                    programaData = json.data;
                    poblarConsultorios();
                }
            } catch (err) {
                console.error("Error al obtener datos de PROGRAMA", err);
            }
        }

        function poblarConsultorios() {
            const select = document.getElementById('consultorio');
            select.innerHTML = '<option value="" disabled selected>Seleccione Consultorio</option>';
            const consultoriosUnicos = [...new Set(programaData.map(p => p.consultorio))];
            consultoriosUnicos.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function actualizarFechasDisponibles() {
            const cons = document.getElementById('consultorio').value;
            const selectFecha = document.getElementById('fecha_cita');
            selectFecha.innerHTML = '<option value="" disabled selected>Seleccione Fecha</option>';
            document.getElementById('hora_atencion').innerHTML = '<option value="" disabled selected>Seleccione Fecha Primero</option>';

            const fechasFiltradas = [...new Set(
                programaData.filter(p => p.consultorio === cons).map(p => p.fecha)
            )];

            fechasFiltradas.forEach(f => {
                selectFecha.innerHTML += `<option value="${f}">${f}</option>`;
            });
        }

        function actualizarHorasDisponibles() {
            const cons = document.getElementById('consultorio').value;
            const fechaSelected = document.getElementById('fecha_cita').value;
            const selectHora = document.getElementById('hora_atencion');
            selectHora.innerHTML = '<option value="" disabled selected>Seleccione Hora</option>';

            // Calcular edad automáticamente restando la Fecha Cita de la Fecha Nacimiento (Columna J)
            if (fechaNacimientoRaw) {
                const edadCalculada = calcularEdadAlDiaDeCita(fechaNacimientoRaw, fechaSelected);
                document.getElementById('edad').value = edadCalculada;
            } else {
                document.getElementById('edad').value = "MADRE";
            }

            const horasFiltradas = [...new Set(
                programaData.filter(p => p.consultorio === cons && p.fecha === fechaSelected).map(p => p.hora)
            )];

            horasFiltradas.forEach(h => {
                selectHora.innerHTML += `<option value="${h}">${h}</option>`;
            });
        }

        async function agendarCitaFinal() {
            const dni = document.getElementById('dniInput').value.trim();
            const nombre = document.getElementById('nombre_paciente').value;
            const fnac = document.getElementById('fecha_nacimiento').value;
            const cel = document.getElementById('celular').value.trim();
            const edad = document.getElementById('edad').value;
            const consultorio = document.getElementById('consultorio').value;
            const fechaCita = document.getElementById('fecha_cita').value;
            const horaAtencion = document.getElementById('hora_atencion').value;

            if (!cel || !consultorio || !fechaCita || !horaAtencion) {
                return Swal.fire({
                    icon: 'warning',
                    title: 'Campos Incompletos',
                    text: 'Por favor complete todos los campos obligatorios.',
                    confirmButtonColor: '#06b6d4'
                });
            }

            const payload = {
                dni_paciente: dni,
                nombre_paciente: nombre,
                fecha_nacimiento: fnac,
                celular: cel,
                edad: edad,
                consultorio: consultorio,
                fecha_cita: fechaCita,
                hora_atencion: horaAtencion
            };

            const btn = document.getElementById('btnAgendar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl"></i> PROCESANDO...';

            try {
                const response = await fetch(URL_DESTINO, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "error_cupos") {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Sin Cupos Disponibles',
                        text: 'No hay cupos para la fecha y hora seleccionada.',
                        confirmButtonColor: '#06b6d4'
                    });
                } else if (result.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Cita Agendada! 🎉',
                        text: 'Acuda a la hora de cita, no hay reprogramación.',
                        confirmButtonColor: '#10b981'
                    });
                    document.getElementById('appointmentForm').reset();
                    document.getElementById('resultPanel').classList.add('hidden');
                    document.getElementById('initialHelp').classList.remove('hidden');
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: result.message || 'No se pudo guardar la cita.',
                        confirmButtonColor: '#06b6d4'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Servidor',
                    text: 'Hubo un inconveniente al registrar la cita.',
                    confirmButtonColor: '#06b6d4'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle text-2xl"></i> ¡CONFIRMAR CITA!';
            }
        }
    </script>
</body>
</html>
