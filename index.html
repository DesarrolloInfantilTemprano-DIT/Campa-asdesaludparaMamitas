<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Programación de Citas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
        }

        .input-premium {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #cbd5e1;
            transition: all 0.3s ease;
        }

        .input-premium:focus {
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 py-8">

    <div class="glass-card w-full max-w-2xl rounded-[2.5rem] overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-700 via-indigo-800 to-purple-900 p-8 text-white relative">
            <span class="bg-white/10 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-white/10">
                <i class="fas fa-hospital-user mr-1"></i> Módulo de Programación
            </span>
            <h1 class="text-3xl font-extrabold mt-3">Agendamiento de Citas</h1>
            <p class="text-indigo-200 text-xs mt-1">Valide la identificación del paciente para continuar</p>
        </div>

        <form id="appointmentForm" class="p-6 md:p-8 space-y-6">
            
            <!-- Paso 1: Validación DNI -->
            <div class="space-y-3">
                <label class="text-xs font-extrabold text-indigo-700 uppercase tracking-wider block">1. Identificación del Paciente</label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="dniInput" maxlength="8" required
                            class="w-full pl-11 pr-4 py-3.5 rounded-2xl outline-none input-premium font-bold text-slate-800"
                            placeholder="Ingrese DNI del paciente">
                    </div>
                    <button type="button" onclick="validarConsultaDNI()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 rounded-2xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-indigo-100">
                        <i class="fas fa-search"></i> Validar
                    </button>
                </div>
            </div>

            <!-- Panel Datos y Cita -->
            <div id="resultPanel" class="hidden space-y-6 pt-4 border-t border-slate-200">
                
                <!-- Datos Filiatorios -->
                <div class="space-y-4">
                    <label class="text-xs font-extrabold text-indigo-700 uppercase tracking-wider block">2. Datos del Paciente</label>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-full">
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Nombres y Apellidos</label>
                            <input type="text" id="nombre_paciente" readonly class="w-full p-3 rounded-xl bg-slate-100 font-bold text-slate-800 outline-none border border-slate-200">
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Fecha Nacimiento (DD/MM/YYYY)</label>
                            <input type="text" id="fecha_nacimiento" placeholder="01/01/2020" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">N° Celular</label>
                            <input type="text" id="celular" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                        </div>

                        <div class="col-span-full">
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Edad del Paciente</label>
                            <select id="edad" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione opción</option>
                                <option value="recien nacido">Recién Nacido</option>
                                <option value="menor de un año">Menor de 1 Año</option>
                                <option value="un año">1 Año</option>
                                <option value="dos años">2 Años</option>
                                <option value="tres años">3 Años</option>
                                <option value="cuatro años">4 Años</option>
                                <option value="adulto">Adulto</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Programación -->
                <div class="space-y-4 pt-4 border-t border-dashed border-slate-200">
                    <label class="text-xs font-extrabold text-indigo-700 uppercase tracking-wider block">3. Programación de la Cita</label>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Consultorio</label>
                            <select id="consultorio" onchange="actualizarFechasDisponibles()" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Cargando...</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Fecha Cita</label>
                            <select id="fecha_cita" onchange="actualizarHorasDisponibles()" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione Consultorio</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[11px] font-semibold text-slate-500 uppercase">Hora Atención</label>
                            <select id="hora_atencion" required class="w-full p-3 rounded-xl input-premium font-semibold text-slate-800 outline-none">
                                <option value="" disabled selected>Seleccione Fecha</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Botón Agendar -->
                <button type="button" id="btnAgendar" onclick="agendarCitaFinal()"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-100 transition-all">
                    <i class="fas fa-calendar-check mr-2"></i> AGENDAR CITA
                </button>
            </div>

            <!-- Ayuda Inicial -->
            <div id="initialHelp" class="text-center py-10 text-slate-400">
                <i class="fas fa-search-location text-4xl mb-3 text-indigo-400"></i>
                <p class="text-sm font-semibold text-slate-600">Ingrese el DNI del paciente</p>
                <p class="text-xs text-slate-400 mt-1">Solo los registros autorizados podrán seleccionar cita.</p>
            </div>

        </form>
    </div>

    <script>
        const URL_CONSULTA = "https://script.google.com/macros/s/AKfycbzFJPWYyiVo1d5lJnG6LtRRkCp6pOyvfvMbApsa1GWTr02m4b2NLLvV7XyKOIyPVVcCmg/exec";
        const URL_DESTINO  = "https://script.google.com/macros/s/AKfycbxUkxJB2Yv9naEFRcFMoPs1ZbgYDcD4e_jdqABLPj0vx65Z7wNsmouECTTiC8fSvfdVuA/exec";

        let programaData = [];

        // 1. Validar DNI en la URL de consulta
        async function validarConsultaDNI() {
            const dni = document.getElementById('dniInput').value.trim();
            if (dni.length < 8) return Swal.fire('DNI Invalido', 'Ingrese los 8 dígitos correspondientes.', 'warning');

            Swal.fire({
                title: 'Validando Padrón',
                text: 'Buscando autorización en la base de datos...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const response = await fetch(URL_CONSULTA);
                const data = await response.json();

                // Búsqueda en el padrón por madre o por hijo
                const registro = data.find(item => 
                    String(item.dniMadre).trim() === dni || String(item.dniHijo).trim() === dni
                );

                if (registro) {
                    const nombreEncontrado = registro.nombreMadre || registro.nombreHijo || "PACIENTE REGISTRADO";
                    document.getElementById('nombre_paciente').value = nombreEncontrado;
                    document.getElementById('celular').value = registro.celular || "";

                    // Cargar opciones desde la hoja PROGRAMA
                    await cargarProgramaConfig();

                    document.getElementById('resultPanel').classList.remove('hidden');
                    document.getElementById('initialHelp').classList.add('hidden');
                    Swal.close();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'DNI No Autorizado',
                        text: 'El DNI ingresado no se encuentra en el registro de consulta previa.',
                        confirmButtonColor: '#4f46e5'
                    });
                    document.getElementById('resultPanel').classList.add('hidden');
                    document.getElementById('initialHelp').classList.remove('hidden');
                }
            } catch (err) {
                Swal.fire('Error de Conexión', 'No se pudo validar el DNI contra la base de datos.', 'error');
            }
        }

        // 2. Obtener la hoja PROGRAMA desde Apps Script
        async function cargarProgramaConfig() {
            try {
                const res = await fetch(URL_DESTINO + "?action=obtenerPrograma");
                const json = await res.json();
                if (json.status === "success") {
                    programaData = json.data;
                    poblarConsultorios();
                }
            } catch (err) {
                console.error("Error al cargar datos de PROGRAMA", err);
            }
        }

        function poblarConsultorios() {
            const select = document.getElementById('consultorio');
            select.innerHTML = '<option value="" disabled selected>Seleccione Consultorio</option>';
            const consultoriosUnicos = [...new Set(programaData.map(p => p.consultorio))];
            consultoriosUnicos.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function actualizarFechasDisponibles() {
            const cons = document.getElementById('consultorio').value;
            const selectFecha = document.getElementById('fecha_cita');
            selectFecha.innerHTML = '<option value="" disabled selected>Seleccione Fecha</option>';
            document.getElementById('hora_atencion').innerHTML = '<option value="" disabled selected>Seleccione Fecha</option>';

            const fechasFiltradas = [...new Set(programaData.filter(p => p.consultorio === cons).map(p => p.fecha))];
            fechasFiltradas.forEach(f => {
                selectFecha.innerHTML += `<option value="${f}">${f}</option>`;
            });
        }

        function actualizarHorasDisponibles() {
            const cons = document.getElementById('consultorio').value;
            const fecha = document.getElementById('fecha_cita').value;
            const selectHora = document.getElementById('hora_atencion');
            selectHora.innerHTML = '<option value="" disabled selected>Seleccione Hora</option>';

            const horasFiltradas = programaData.filter(p => p.consultorio === cons && p.fecha === fecha).map(p => p.hora);
            horasFiltradas.forEach(h => {
                selectHora.innerHTML += `<option value="${h}">${h}</option>`;
            });
        }

        // 3. Procesar Agendamiento
        async function agendarCitaFinal() {
            const dni = document.getElementById('dniInput').value.trim();
            const nombre = document.getElementById('nombre_paciente').value;
            const fnac = document.getElementById('fecha_nacimiento').value.trim();
            const cel = document.getElementById('celular').value.trim();
            const edad = document.getElementById('edad').value;
            const consultorio = document.getElementById('consultorio').value;
            const fechaCita = document.getElementById('fecha_cita').value;
            const horaAtencion = document.getElementById('hora_atencion').value;

            if (!fnac || !cel || !edad || !consultorio || !fechaCita || !horaAtencion) {
                return Swal.fire('Campos Incompletos', 'Por favor complete todos los datos del formulario.', 'warning');
            }

            const payload = {
                dni_paciente: dni,
                nombre_paciente: nombre,
                fecha_nacimiento: fnac,
                celular: cel,
                edad: edad,
                consultorio: consultorio,
                fecha_cita: fechaCita,
                hora_atencion: horaAtencion
            };

            const btn = document.getElementById('btnAgendar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> PROCESANDO...';

            try {
                const response = await fetch(URL_DESTINO, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "error_cupos") {
                    // Aviso Elegante de Sin Cupos
                    Swal.fire({
                        icon: 'warning',
                        title: '¡Cupos Agotados!',
                        html: `
                            <div class="p-2">
                                <p class="text-slate-600 font-medium">No quedan cupos disponibles para:</p>
                                <div class="my-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-left text-sm text-amber-900 space-y-1">
                                    <p><strong>Consultorio:</strong> ${consultorio}</p>
                                    <p><strong>Fecha:</strong> ${fechaCita}</p>
                                    <p><strong>Horario:</strong> ${horaAtencion}</p>
                                </div>
                                <p class="text-xs text-slate-500">Por favor, seleccione otra fecha u horario disponible.</p>
                            </div>
                        `,
                        confirmButtonText: 'Entendido',
                        confirmButtonColor: '#f59e0b'
                    });
                } else if (result.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Cita Confirmada!',
                        text: 'La cita ha sido registrada exitosamente en la base de datos.',
                        confirmButtonColor: '#4f46e5'
                    });
                    document.getElementById('appointmentForm').reset();
                    document.getElementById('resultPanel').classList.add('hidden');
                    document.getElementById('initialHelp').classList.remove('hidden');
                } else {
                    Swal.fire('Error', result.message || 'Ocurrió un inconveniente al procesar.', 'error');
                }
            } catch (err) {
                Swal.fire('Error de Red', 'No se pudo comunicar con el servidor.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-calendar-check mr-2"></i> AGENDAR CITA';
            }
        }
    </script>
</body>
</html>
